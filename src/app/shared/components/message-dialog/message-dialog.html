@if (config.type === 'warning') {
  <div class="modal-backdrop">
    <div class="warn-card">
      <div class="warn-icon-circle">
        <svg class="warn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h2>{{ config.title }}</h2>
      <p>{{ config.message }}</p>
      @if (config.hint) {
        <p class="warn-hint">{{ config.hint }}</p>
      }
      <div class="warn-actions">
        @if (config.showCancel) {
          <button class="warn-btn warn-cancel" (click)="close(false)">
            {{ config.cancelText || 'Cancelar' }}
          </button>
        }
        <button class="warn-btn warn-confirm" (click)="close(true)">
          <svg class="warn-btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          {{ config.confirmText || 'Aceptar' }}
        </button>
      </div>
    </div>
  </div>
} @else {
  <div class="modal-backdrop">
    <div class="modal-card" [ngClass]="config.type">
      <span class="material-symbols-outlined icon">
        {{ icon }}
      </span>
      <h2>{{ config.title }}</h2>
      <p>{{ config.message }}</p>
      <div class="actions">
        @if (config.showCancel) {
          <button class="btn cancel" (click)="close(false)">
            {{ config.cancelText || 'Cancelar' }}
          </button>
        }
        <button class="btn confirm" (click)="close(true)">
          {{ config.confirmText || 'Aceptar' }}
        </button>
      </div>
    </div>
  </div>
}
